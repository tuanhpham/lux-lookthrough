<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Screener — TS</title>

    <!-- PWA: installable ("Add to Home Screen"), opens full-screen like an app.
         The web build registers /sw.js (see main.ts); Tauri ignores it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Pattern-based US equity screener: VCP setups, Stage-2 momentum, 0–100 conviction score, charts and paper trading." />
    <!-- iOS standalone (Safari → Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Screener" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Boot-phase error trap: surfaces module import/init failures (which would
         otherwise be a silent black screen). It disarms once the app mounts
         (window.__APP_READY__), so benign runtime errors after load — e.g. a
         chart resize firing after disposal — never blank the whole app. -->
    <script>
      (function () {
        function ignorable(msg) {
          // Known-benign lightweight-charts teardown noise.
          return /Object is disposed/i.test(msg);
        }
        function paint(msg) {
          if (window.__APP_READY__ || ignorable(msg)) return;
          var b = document.getElementById('boot-error') || document.createElement('div');
          b.id = 'boot-error';
          b.style.cssText =
            'position:fixed;inset:12px;z-index:99999;background:#1a0d10;color:#ffb3ba;border:1px solid #ff5d6c;border-radius:12px;padding:16px;font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto';
          b.textContent = 'App error (boot):\n\n' + msg;
          (document.body || document.documentElement).appendChild(b);
        }
        window.addEventListener('error', function (e) {
          paint(String((e.error && e.error.stack) || e.message || e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          paint('Unhandled rejection:\n' + String((e.reason && e.reason.stack) || e.reason));
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Landing overlay (shown first; hidden after “Launch”). -->
    <div id="landing"></div>

    <div id="app" class="hidden">
      <aside id="sidebar">
        <button class="brand" id="logo-home" title="Back to landing">
          <div class="logo logo-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M21 7v5h-5"/></svg></div>
          <div>
            <div class="brand-name" data-i18n="brand.name">Screener</div>
            <div class="brand-sub" data-i18n="brand.sub">TypeScript edition</div>
          </div>
        </button>
        <nav id="nav">
          <button data-tab="picks" class="nav-btn active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg><span data-i18n="nav.picks">Top Picks</span></button>
          <button data-tab="screener" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span data-i18n="nav.screener">Screener</span></button>
          <button data-tab="watchlist" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span data-i18n="nav.watchlist">Watchlists</span></button>
          <button data-tab="sectors" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg><span data-i18n="nav.sectors">Sectors</span></button>
          <button data-tab="portfolio" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg><span data-i18n="nav.portfolio">Paper Trading</span></button>
          <button data-tab="blog" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v14H5.2L4 19.2z"/><path d="M8 9h8M8 13h5"/></svg><span data-i18n="nav.blog">Analysis</span></button>
          <button data-tab="playbook" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h7a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9z"/><path d="M9 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h2"/><path d="M12 7h3M12 11h3"/></svg><span data-i18n="nav.playbook">Playbook</span></button>
          <button data-tab="learn" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h7v18H6a2 2 0 0 0-2 2z"/><path d="M20 3v18a2 2 0 0 0-2-2h-5V3z"/></svg><span data-i18n="nav.learn">Learn</span></button>
        </nav>
        <div class="sidebar-foot">
          <div class="row" style="gap:8px">
            <div class="lang-toggle" role="group" aria-label="Language">
              <button data-lang-btn="en">EN</button>
              <button data-lang-btn="vi">VI</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">🌙</button>
          </div>
          <span data-i18n="foot.disclaimer">Educational use only. Not financial advice.</span>
        </div>
      </aside>
      <main id="main">
        <section id="tab-picks" class="tab"></section>
        <section id="tab-screener" class="tab hidden"></section>
        <section id="tab-watchlist" class="tab hidden"></section>
        <section id="tab-sectors" class="tab hidden"></section>
        <section id="tab-portfolio" class="tab hidden"></section>
        <section id="tab-blog" class="tab hidden"></section>
        <section id="tab-playbook" class="tab hidden"></section>
        <section id="tab-learn" class="tab hidden"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <div id="modal-title">—</div>
          <button id="modal-close">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
    <div id="tooltip" class="tooltip hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
