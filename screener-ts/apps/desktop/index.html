<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Professional — Screener for The Professionals</title>

    <!-- PWA: installable ("Add to Home Screen"), opens full-screen like an app.
         The web build registers /sw.js (see main.ts); Tauri ignores it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07080b" />
    <meta name="description" content="Qullamaggie + momentum equity screener: VCP & episodic-pivot setups, a 0–100 quality score, market regime, sector rotation, charts and paper trading." />

    <!-- Typefaces: Hanken Grotesk (refined grotesk UI) + JetBrains Mono
         (tabular numerals for every price/return/score — the terminal signature). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- iOS standalone (Safari → Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Screener" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Boot-phase error trap: surfaces module import/init failures (which would
         otherwise be a silent black screen). It disarms once the app mounts
         (window.__APP_READY__), so benign runtime errors after load — e.g. a
         chart resize firing after disposal — never blank the whole app. -->
    <script>
      (function () {
        function ignorable(msg) {
          // Known-benign lightweight-charts teardown noise.
          return /Object is disposed/i.test(msg);
        }
        function paint(msg) {
          if (window.__APP_READY__ || ignorable(msg)) return;
          var b = document.getElementById('boot-error') || document.createElement('div');
          b.id = 'boot-error';
          b.style.cssText =
            'position:fixed;inset:12px;z-index:99999;background:#1a0d10;color:#ffb3ba;border:1px solid #ff5d6c;border-radius:12px;padding:16px;font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto';
          b.textContent = 'App error (boot):\n\n' + msg;
          (document.body || document.documentElement).appendChild(b);
        }
        window.addEventListener('error', function (e) {
          paint(String((e.error && e.error.stack) || e.message || e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          paint('Unhandled rejection:\n' + String((e.reason && e.reason.stack) || e.reason));
        });
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Landing overlay (shown first; hidden after “Launch”). -->
    <div id="landing"></div>

    <div id="app" class="hidden">
      <!-- TradingView-style sticky top navigation: brand left, inline tabs
           center, language/theme right. On phones the tabs collapse behind the
           hamburger into a dropdown (#topnav-menu). -->
      <header id="topnav">
        <button id="menu-toggle" class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="topnav-brand" id="logo-home" title="Back to landing">
          <div class="logo logo-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M21 7v5h-5"/></svg></div>
          <span class="brand-name" data-i18n="brand.name">The Professional</span>
        </button>
        <nav id="nav" class="topnav-tabs">
          <button data-tab="picks" class="nav-btn active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/><line x1="12" y1="9" x2="12" y2="20"/><line x1="4" y1="4" x2="20" y2="4"/></svg>
            <span data-i18n="nav.picks">Top Picks</span>
          </button>
          <button data-tab="screener" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span data-i18n="nav.screener">Screener</span>
          </button>
          <button data-tab="watchlist" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="nav.watchlist">Watchlists</span>
          </button>
          <button data-tab="sectors" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            <span data-i18n="nav.sectors">Sectors</span>
          </button>
          <button data-tab="portfolio" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span data-i18n="nav.portfolio">Paper Trading</span>
          </button>
          <button data-tab="backtest" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span data-i18n="nav.backtest">Backtest</span>
          </button>
          <button data-tab="blog" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span data-i18n="nav.blog">Analysis</span>
          </button>
          <button data-tab="playbook" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span data-i18n="nav.playbook">Playbook</span>
          </button>
          <button data-tab="learn" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span data-i18n="nav.learn">Learn</span>
          </button>
          <button data-tab="about" class="nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="nav.about">About</span>
          </button>
        </nav>
        <div class="topnav-controls">
          <button id="sync-toggle" class="theme-toggle" title="Device sync" aria-label="Device sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          </button>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button data-lang-btn="en">EN</button>
            <button data-lang-btn="vi">VI</button>
          </div>
          <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">🌙</button>
        </div>
      </header>
      <!-- Dim backdrop behind the open mobile dropdown. -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      <main id="main">
        <section id="tab-picks" class="tab"></section>
        <section id="tab-screener" class="tab hidden"></section>
        <section id="tab-watchlist" class="tab hidden"></section>
        <section id="tab-sectors" class="tab hidden"></section>
        <section id="tab-portfolio" class="tab hidden"></section>
        <section id="tab-backtest" class="tab hidden"></section>
        <section id="tab-blog" class="tab hidden"></section>
        <section id="tab-playbook" class="tab hidden"></section>
        <section id="tab-learn" class="tab hidden"></section>
        <section id="tab-about" class="tab hidden"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <div id="modal-title">—</div>
          <button id="modal-close">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
    <div id="tooltip" class="tooltip hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
