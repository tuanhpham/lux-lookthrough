<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screener — TS</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Landing overlay (shown first; hidden after “Launch”). -->
    <div id="landing"></div>

    <div id="app" class="hidden">
      <aside id="sidebar">
        <div class="brand">
          <div class="logo">▲</div>
          <div>
            <div class="brand-name" data-i18n="brand.name">Screener</div>
            <div class="brand-sub" data-i18n="brand.sub">TypeScript edition</div>
          </div>
        </div>
        <nav id="nav">
          <button data-tab="picks" class="nav-btn active" data-i18n="nav.picks">Top Picks</button>
          <button data-tab="screener" class="nav-btn" data-i18n="nav.screener">Screener</button>
          <button data-tab="watchlist" class="nav-btn" data-i18n="nav.watchlist">Watchlists</button>
          <button data-tab="sectors" class="nav-btn" data-i18n="nav.sectors">Sectors</button>
          <button data-tab="portfolio" class="nav-btn" data-i18n="nav.portfolio">Paper Trading</button>
          <button data-tab="blog" class="nav-btn" data-i18n="nav.blog">Weekly Analysis</button>
          <button data-tab="learn" class="nav-btn" data-i18n="nav.learn">Learn</button>
        </nav>
        <div class="sidebar-foot">
          <div class="lang-toggle" role="group" aria-label="Language">
            <button data-lang-btn="en">EN</button>
            <button data-lang-btn="vi">VI</button>
          </div>
          <span data-i18n="foot.disclaimer">Educational use only. Not financial advice.</span>
        </div>
      </aside>
      <main id="main">
        <section id="tab-picks" class="tab"></section>
        <section id="tab-screener" class="tab hidden"></section>
        <section id="tab-watchlist" class="tab hidden"></section>
        <section id="tab-sectors" class="tab hidden"></section>
        <section id="tab-portfolio" class="tab hidden"></section>
        <section id="tab-blog" class="tab hidden"></section>
        <section id="tab-learn" class="tab hidden"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <div id="modal-title">—</div>
          <button id="modal-close">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
