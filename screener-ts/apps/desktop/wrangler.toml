# Cloudflare Pages config for the static web deploy.
# Functions in ./functions (api/yahoo, api/finnhub, api/vndirect, api/wiki,
# api/nasdaqtrader) are auto-discovered RELATIVE TO THE DEPLOY DIRECTORY — so you
# MUST run `wrangler pages deploy` from THIS directory (apps/desktop). Deploying
# from the monorepo root ships the site WITHOUT the proxies → no stock data loads.
#
# Deploy (build from the root, then deploy from here):
#   (cd ../.. && npm run build --workspace @screener/core && npm run build --workspace @screener/desktop)
#   npx wrangler pages deploy dist --project-name screener
#   npx wrangler pages secret put FINNHUB_API_KEY --project-name screener   # optional fallback provider
name = "screener"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# D1 database for cross-device sync (watchlists, posts, paper-trading accounts,
# once-a-day scan results). The binding name `DB` is what functions/api/sync
# reads (env.DB). Create the DB once with `wrangler d1 create screener-sync`,
# then paste the printed database_id below. See deploy notes for the full
# command sequence.
[[d1_databases]]
binding = "DB"
database_name = "screener-sync"
database_id = "REPLACE_WITH_DATABASE_ID"
