# Cloudflare Pages config for the static web deploy.
# Functions in ./functions are auto-discovered (api/yahoo, api/finnhub).
#
# Deploy:
#   npm run build               # produces dist/
#   npx wrangler pages deploy dist --project-name screener
#   npx wrangler pages secret put FINNHUB_API_KEY   # optional fallback provider
name = "screener"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
