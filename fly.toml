# fly.toml app configuration file generated by Fly CLI
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "amr-stock-screener"
primary_region = "sjc"

[build]
dockerfile = "backend/Dockerfile"

[env]
  CACHE_TTL_SECONDS = "900"
  DATA_PROVIDER = "yfinance"
  APP_ENV = "production"
  SECRET_KEY = "production-secret-key-change-in-production"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    timeout = "2s"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
